desc: ゲストログインテスト
runners:
  req:
    endpoint: http://localhost:3000
    useCookie: true
    notFollowRedirect: true
    openapi3: http://localhost:3000/static/oas/openapi.yaml
    skipValidateRequest: false
    skipValidateResponse: true
  dev: postgres://kotohiro:kotohiro@localhost:5432/kotohiro?sslmode=disable

vars:
  normalUserId: guest_test_normal_user
  normalUserName: guest_test_normal_user

steps:
  # ========================================
  # セットアップ: テストデータのクリーンアップ
  # ========================================
  cleanup:
    desc: テストデータ削除
    dev:
      query: |
        DELETE FROM opinions WHERE talk_session_id IN (SELECT talk_session_id FROM talk_sessions WHERE theme LIKE 'ゲストテスト%');
        DELETE FROM votes WHERE talk_session_id IN (SELECT talk_session_id FROM talk_sessions WHERE theme LIKE 'ゲストテスト%');
        DELETE FROM talksession_consents WHERE talksession_id IN (SELECT talk_session_id FROM talk_sessions WHERE theme LIKE 'ゲストテスト%');
        DELETE FROM talk_sessions WHERE theme LIKE 'ゲストテスト%';
        DELETE FROM user_status_change_logs WHERE user_id IN (SELECT user_id FROM users WHERE display_id = '{{ vars.normalUserId }}');
        DELETE FROM user_demographics WHERE user_id IN (SELECT user_id FROM users WHERE display_id = '{{ vars.normalUserId }}');
        DELETE FROM user_auths WHERE subject = '{{ vars.normalUserId }}';
        DELETE FROM users WHERE display_id = '{{ vars.normalUserId }}';
        DELETE FROM user_auths WHERE subject LIKE 'guest_%';
        DELETE FROM users WHERE display_id ~ '^[0-9]{8}$';
        DELETE FROM sessions WHERE user_id NOT IN (SELECT user_id FROM users);

  # ========================================
  # テスト1: ゲストログイン基本機能
  # ========================================
  guestLogin:
    desc: ゲストログイン
    req:
      /auth/guest/login:
        post:
          body:
            application/json: {}
    bind:
      guestLoginRes: current.res
    test: |
      current.res.status == 200 &&
      len(current.res.headers['Set-Cookie']) > 0

  guestTokenInfo:
    desc: ゲストユーザーのトークン情報確認（isGuest=true）
    req:
      /auth/token/info:
        get:
          headers: null
    bind:
      guestToken: current.res.body
    dump:
      expr: current.res.body
    test: |
      current.res.status == 200 &&
      current.res.body.aud == "https://api.kotohiro.com" &&
      current.res.body.isGuest == true &&
      current.res.body.displayID != null &&
      current.res.body.displayName != null

  # ========================================
  # テスト2: ゲストユーザーの制限（セッション作成不可）
  # ========================================
  guestCannotCreateSession:
    desc: ゲストユーザーはセッションを作成できない
    req:
      /talksessions:
        post:
          body:
            multipart/form-data:
              theme: "ゲストテストセッション"
              description: "テスト説明"
              scheduledEndTime: "2100-12-31T23:59:59Z"
    test: |
      current.res.status == 403

  # ========================================
  # テスト3: ゲストユーザーの制限（表示名変更不可）
  # ========================================
  guestCannotChangeName:
    desc: ゲストユーザーは表示名を変更できない
    req:
      /user:
        put:
          body:
            multipart/form-data:
              displayName: "新しい名前"
    test: |
      current.res.status == 403

  # ========================================
  # セットアップ: 通常ユーザーでセッション作成
  # ========================================
  normalUserLogin:
    desc: 通常ユーザーログイン
    req:
      /auth/dev/login?redirect_url=http%3A%2F%2Flocalhost%3A3000%2Fauth%2Ftoken%2Finfo&id={{ vars.normalUserId }}:
        get:
          headers: null
    test: len(current.res.headers['Set-Cookie']) > 0

  normalUserCreate:
    desc: 通常ユーザー作成
    req:
      /user:
        post:
          body:
            multipart/form-data:
              displayName: "{{ vars.normalUserName }}"
              displayID: "{{ vars.normalUserId }}"
              prefecture: "東京都"
              city: "渋谷区"
    test: current.res.body.displayID == vars.normalUserId

  createUnrestrictedSession:
    desc: 制限なしセッション作成
    req:
      /talksessions:
        post:
          body:
            multipart/form-data:
              theme: "ゲストテスト制限なしセッション"
              description: "制限なしのテストセッション"
              scheduledEndTime: "2100-12-31T23:59:59Z"
              hideTop: "false"
    bind:
      unrestrictedSession: current.res.body
    test: |
      current.res.status == 200 &&
      current.res.body.theme == "ゲストテスト制限なしセッション"

  createRestrictedSession:
    desc: 制限ありセッション作成（都道府県制限）
    req:
      /talksessions:
        post:
          body:
            multipart/form-data:
              theme: "ゲストテスト制限ありセッション"
              description: "制限ありのテストセッション"
              scheduledEndTime: "2100-12-31T23:59:59Z"
              restrictions: '["demographics.prefecture"]'
              hideTop: "false"
    bind:
      restrictedSession: current.res.body
    test: |
      current.res.status == 200 &&
      current.res.body.theme == "ゲストテスト制限ありセッション"

  # ========================================
  # テスト4: ゲストユーザーで制限なしセッションに参加可能
  # ========================================
  switchBackToGuest:
    desc: ゲストユーザーに切り替え（新規ゲスト作成）
    req:
      /auth/guest/login:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200 &&
      len(current.res.headers['Set-Cookie']) > 0

  verifyGuestSession:
    desc: ゲストセッション確認
    req:
      /auth/token/info:
        get:
          headers: null
    bind:
      guestTokenForSession: current.res.body
    test: |
      current.res.status == 200 &&
      current.res.body.isGuest == true

  guestConsentToUnrestrictedSession:
    desc: ゲストユーザーが制限なしセッションに同意
    req:
      /talksessions/{{ unrestrictedSession.id }}/consent:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200

  guestCanPostOpinionToUnrestrictedSession:
    desc: ゲストユーザーが制限なしセッションに意見投稿可能
    req:
      /opinions:
        post:
          body:
            multipart/form-data:
              talkSessionID: "{{ unrestrictedSession.id }}"
              content: "ゲストユーザーからの意見です"
    bind:
      guestOpinion: current.res.body
    test: |
      current.res.status == 200

  # ========================================
  # テスト5: ゲストユーザーで制限ありセッションに参加不可
  # ========================================
  guestCannotJoinRestrictedSession:
    desc: ゲストユーザーは制限ありセッションに同意できない
    req:
      /talksessions/{{ restrictedSession.id }}/consent:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 403

  # ========================================
  # クリーンアップ
  # ========================================
  finalCleanup:
    desc: テストデータ最終削除
    dev:
      query: |
        DELETE FROM opinions WHERE talk_session_id IN (SELECT talk_session_id FROM talk_sessions WHERE theme LIKE 'ゲストテスト%');
        DELETE FROM votes WHERE talk_session_id IN (SELECT talk_session_id FROM talk_sessions WHERE theme LIKE 'ゲストテスト%');
        DELETE FROM talksession_consents WHERE talksession_id IN (SELECT talk_session_id FROM talk_sessions WHERE theme LIKE 'ゲストテスト%');
        DELETE FROM talk_sessions WHERE theme LIKE 'ゲストテスト%';
        DELETE FROM user_status_change_logs WHERE user_id IN (SELECT user_id FROM users WHERE display_id = '{{ vars.normalUserId }}');
        DELETE FROM user_demographics WHERE user_id IN (SELECT user_id FROM users WHERE display_id = '{{ vars.normalUserId }}');
        DELETE FROM user_auths WHERE subject = '{{ vars.normalUserId }}';
        DELETE FROM users WHERE display_id = '{{ vars.normalUserId }}';
        DELETE FROM user_auths WHERE subject LIKE 'guest_%';
        DELETE FROM users WHERE display_id ~ '^[0-9]{8}$';
        DELETE FROM sessions WHERE user_id NOT IN (SELECT user_id FROM users);
