<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログインの本人確認 | ことひろ</title>
<style nonce="{{NONCE}}">
body{font-family:system-ui,sans-serif;background:#f5f6f8;color:#20242a;margin:0;padding:24px}main{max-width:420px;margin:10vh auto;padding:32px;background:white;border-radius:16px}h1{font-size:24px}button{border:0;border-radius:8px;padding:12px 18px;background:#356de5;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{display:block;box-sizing:border-box;width:100%;padding:10px;margin:8px 0 16px}p{line-height:1.6}hr{margin:28px 0;border:0;border-top:1px solid #ddd}
</style>
</head>
<body><main>
<h1>ログインの本人確認</h1>
<p>ログインを開始したブラウザで、確認ボタンを押してください。</p>
<button id="confirm" type="button">ログインを確認する</button>
<p id="status" role="status" aria-live="polite"></p>
<!--LOCAL-START-->
<section id="local"><hr><h2>ローカル検証用ログイン</h2>
<p>登録済みのパスワードアカウントでログインを開始します。メールはMailpit（localhost:8025）で確認できます。</p>
<form id="login"><label>メールアドレス / ID<input name="idOrEmail" autocomplete="username" required></label>
<label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">確認メールを送る</button></form></section>
<!--LOCAL-END-->
</main>
<script nonce="{{NONCE}}">
let token = '';
const status = document.getElementById('status');
const confirm = document.getElementById('confirm');
function readLink() {
  const fragment = location.hash.slice(1);
  if (fragment) {
    token = fragment;
    history.replaceState(null, '', location.pathname);
  }
  confirm.disabled = !token;
  status.textContent = token ? '' : 'メールに届いた確認リンクから、このページを開いてください。';
}
readLink();
addEventListener('hashchange', readLink);
confirm.addEventListener('click', async () => {
  confirm.disabled = true;
  status.textContent = '確認しています…';
  try {
    const response = await fetch(location.pathname, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || '確認できませんでした。再度ログインしてください。');
    status.textContent = '本人確認が完了しました。';
    location.replace(data.redirectURL);
  } catch (error) { status.textContent = error.message || '通信に失敗しました。'; confirm.disabled = false; }
});
const login = document.getElementById('login');
if (login) login.addEventListener('submit', async event => {
  event.preventDefault();
  const button = login.querySelector('button');
  button.disabled = true;
  try {
    const response = await fetch(location.pathname.replace(/verify$/, 'login'), {method:'POST', credentials:'same-origin', body:new FormData(login)});
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'ログインを開始できませんでした。');
    status.textContent = '確認メールを送信しました。15分以内に同じブラウザでリンクを開いてください。';
    login.querySelector('[name=password]').value = '';
  } catch (error) { status.textContent = error.message || '通信に失敗しました。'; }
  finally { button.disabled = false; }
});
</script></body></html>
