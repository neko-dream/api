desc: アンケート全回答暗号化：暗号化保存 → 復号取得の正常系
runners:
  req:
    endpoint: http://localhost:3000
    useCookie: true
    notFollowRedirect: true
    openapi3: http://localhost:3000/static/oas/openapi.yaml
    skipValidateRequest: false
    skipValidateResponse: true
  dev: postgres://kotohiro:kotohiro@localhost:5432/kotohiro?sslmode=disable

vars:
  ownerID: survey_pii_owner
  joinerID: survey_pii_joiner
  prefecture: 東京都
  city: 渋谷区

steps:
  cleanup:
    desc: テストデータ削除
    dev:
      query: |
        DELETE FROM user_status_change_logs WHERE user_id IN (SELECT user_id FROM users WHERE display_id IN ('{{ vars.ownerID }}', '{{ vars.joinerID }}'));
        DELETE FROM user_demographics WHERE user_id IN (SELECT user_id FROM users WHERE display_id IN ('{{ vars.ownerID }}', '{{ vars.joinerID }}'));
        DELETE FROM user_auths WHERE subject IN ('{{ vars.ownerID }}', '{{ vars.joinerID }}');
        DELETE FROM talksession_consents;
        DELETE FROM votes;
        DELETE FROM opinions;
        DELETE FROM talk_sessions;
        DELETE FROM users WHERE display_id IN ('{{ vars.ownerID }}', '{{ vars.joinerID }}');
        DELETE FROM domain_events;

  loginOwner:
    desc: オーナーログイン
    req:
      /auth/dev/login?redirect_url=http%3A%2F%2Flocalhost%3A3000%2Fauth%2Ftoken%2Finfo&id={{ vars.ownerID }}:
        get:
          headers: null

  createOwner:
    desc: オーナー作成
    req:
      /user:
        post:
          body:
            multipart/form-data:
              displayName: "{{ vars.ownerID }}"
              displayID: "{{ vars.ownerID }}"
              prefecture: "{{ vars.prefecture }}"
              city: "{{ vars.city }}"

  createSession:
    desc: セッション作成
    req:
      /talksessions:
        post:
          body:
            multipart/form-data:
              theme: "暗号化アンケート"
              description: "全回答暗号化"
              scheduledEndTime: "2100-12-31T23:59:59Z"
              prefecture: "{{ vars.prefecture }}"
              city: "{{ vars.city }}"
    bind:
      session: current.res.body
    test: current.res.status == 200

  createSurvey:
    desc: single_choice（その他可）でアンケート作成
    req:
      /talksessions/{{ session.id }}/survey:
        post:
          body:
            application/json:
              questions:
                - text: "好きな色は？"
                  type: "single_choice"
                  isRequired: true
                  allowOther: false
                  displayOrder: 0
                  choices:
                    - text: "赤"
                      displayOrder: 0
                    - text: "青"
                      displayOrder: 1
                - text: "ひとことメモ（その他自由入力）"
                  type: "single_choice"
                  isRequired: false
                  allowOther: true
                  maxLength: 200
                  displayOrder: 1
                  choices:
                    - text: "なし"
                      displayOrder: 0
    bind:
      survey: current.res.body
    test: |
      current.res.status == 200 &&
      len(current.res.body.questions) == 2

  loginJoiner:
    desc: 参加者ログイン
    req:
      /auth/dev/login?redirect_url=http%3A%2F%2Flocalhost%3A3000%2Fauth%2Ftoken%2Finfo&id={{ vars.joinerID }}:
        get:
          headers: null

  createJoiner:
    desc: 参加者作成
    req:
      /user:
        post:
          body:
            multipart/form-data:
              displayName: "{{ vars.joinerID }}"
              displayID: "{{ vars.joinerID }}"
              prefecture: "{{ vars.prefecture }}"
              city: "{{ vars.city }}"

  submitAnswers:
    desc: 選択肢 + その他自由入力で回答送信
    req:
      /talksessions/{{ session.id }}/survey/submissions:
        post:
          body:
            application/json:
              answers:
                - questionID: "{{ survey.questions[0].questionID }}"
                  selectedChoiceIDs: ["{{ survey.questions[0].choices[0].choiceID }}"]
                - questionID: "{{ survey.questions[1].questionID }}"
                  other: "secret@example.com"
    test: current.res.status == 200

  verifyDbStoredEncrypted:
    desc: DB 上では回答が暗号化 blob（enc, v1.xxx 形式）として保存され、選択肢 ID・その他テキストは平文で残らない
    dev:
      query: |
        SELECT
          (SELECT is_encrypted FROM talk_session_survey_answers ans
            INNER JOIN talk_session_survey_questions q ON q.question_id = ans.question_id
            WHERE q.question_text = '好きな色は？') AS choice_is_encrypted,
          (SELECT (answer_value->>'enc') LIKE 'v1.%' FROM talk_session_survey_answers ans
            INNER JOIN talk_session_survey_questions q ON q.question_id = ans.question_id
            WHERE q.question_text = '好きな色は？') AS choice_enc_looks_encrypted,
          (SELECT (answer_value ? 'selectedChoiceIDs') FROM talk_session_survey_answers ans
            INNER JOIN talk_session_survey_questions q ON q.question_id = ans.question_id
            WHERE q.question_text = '好きな色は？') AS choice_has_plaintext_ids,
          (SELECT (answer_value->>'enc') LIKE 'v1.%' FROM talk_session_survey_answers ans
            INNER JOIN talk_session_survey_questions q ON q.question_id = ans.question_id
            WHERE q.question_text = 'ひとことメモ（その他自由入力）') AS other_enc_looks_encrypted,
          (SELECT (answer_value ? 'other') FROM talk_session_survey_answers ans
            INNER JOIN talk_session_survey_questions q ON q.question_id = ans.question_id
            WHERE q.question_text = 'ひとことメモ（その他自由入力）') AS other_has_plaintext;
    test: |
      current.rows[0].choice_is_encrypted == true &&
      current.rows[0].choice_enc_looks_encrypted == true &&
      current.rows[0].choice_has_plaintext_ids == false &&
      current.rows[0].other_enc_looks_encrypted == true &&
      current.rows[0].other_has_plaintext == false

  loginOwnerAgain:
    desc: オーナーで再ログイン
    req:
      /auth/dev/login?redirect_url=http%3A%2F%2Flocalhost%3A3000%2Fauth%2Ftoken%2Finfo&id={{ vars.ownerID }}:
        get:
          headers: null

  listSubmissionsDecrypted:
    desc: オーナーが回答一覧取得時、選択肢 ID・その他は復号されて平文で返る
    req:
      /talksessions/{{ session.id }}/survey/submissions:
        get:
          headers: null
    test: |
      current.res.status == 200 &&
      current.res.body.totalCount == 1 &&
      len(filter(current.res.body.submissions[0].answers,
        #.questionID == survey.questions[0].questionID && survey.questions[0].choices[0].choiceID in #.selectedChoiceIDs)) == 1 &&
      len(filter(current.res.body.submissions[0].answers,
        #.questionID == survey.questions[1].questionID && #.other == "secret@example.com")) == 1

  summaryDecryptedAggregation:
    desc: 集計はサーバ側で復号して行われ、選択肢の件数が数えられる
    req:
      /talksessions/{{ session.id }}/survey/summary:
        get:
          headers: null
    test: |
      current.res.status == 200 &&
      current.res.body.questionSummaries[0].answerCount == 1 &&
      len(filter(current.res.body.questionSummaries[0].choiceCounts, #.text == "赤" && #.count == 1)) == 1 &&
      current.res.body.questionSummaries[1].otherCount == 1
