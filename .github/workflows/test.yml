name: Test

on:
  push:
    paths-ignore:
      - '.vscode/**'
      - 'server/static/**'
      - 'server/api/**' # OpenAPIのスキーマファイルなど
      - 'server/internal/presentation/oas/**'
      - 'server/internal/infrastructure/persistence/sqlc/generated/**'

  workflow_call:
    inputs:
      concurrency-group:
        required: true
        type: string
permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write

concurrency:
  group: ${{ inputs.concurrency-group || format('test-{0}-{1}', github.workflow, github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mailpit:
        image: axllent/mailpit:v1.27.9
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: kotohiro
          POSTGRES_PASSWORD: kotohiro
          POSTGRES_DB: kotohiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kotohiro:kotohiro@localhost:5432/kotohiro?sslmode=disable
      ADMIN_TEST_DATABASE_URL: postgres://kotohiro:kotohiro@localhost:5432/kotohiro?sslmode=disable
      MAIL_TEST_DATABASE_URL: postgres://kotohiro:kotohiro@localhost:5432/kotohiro?sslmode=disable
      MAIL_TEST_SMTP_ADDR: 127.0.0.1:1025
      MAIL_TEST_HTTP_URL: http://127.0.0.1:8025
      ENCRYPTION_VERSION: v1
      ENCRYPTION_SECRET: UkadNiT1rGQa3dgBgCgF4rMo7sPhZTzE
      ENV: local
      PORT: 3000


    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'server/go.mod'
          cache: true
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Install dependencies
        run: go mod download

      - name: Test email login and delivery with race detector
        run: go test -race -count=1 ./internal/domain/model/auth/password ./internal/domain/service ./internal/application/usecase/admin_usecase ./internal/application/usecase/auth_usecase ./internal/presentation/handler ./internal/infrastructure/persistence/query/user ./internal/infrastructure/email/... ./internal/infrastructure/external/aws/ses

      - name: Run unit tests with coverage
        run: |
          go test -parallel 2 -v -coverprofile=coverage.out.tmp ./...
          cat coverage.out.tmp | grep -v -E "(_gen\.go|\.gen\.go|\.sql\.go|/mock/|/di/)" > coverage.out
          rm coverage.out.tmp
      - name: Setup runn
        uses: k1LoW/gh-setup@v1
        with:
          repo: k1LoW/runn
      - name: Setup octoconv-runn-coverage
        uses: k1LoW/gh-setup@v1
        with:
          repo: k1LoW/octocov-runn-coverage

      - name: Run E2E tests
        run: |
          ./scripts/test.sh

      - name: coverage tests
        continue-on-error: true
        run: |
          cp ./.env.example ./.env
          go run ./cmd/server/main.go & sleep 3
          runn coverage --format json ./e2e/**/* | octocov-runn-coverage > custom_metrics_runn.json
      - name: Run octocov
        continue-on-error: true
        uses: k1LoW/octocov-action@v1
        with:
          config: server/.octocov.yml
        env:
          OCTOCOV_GITHUB_REF: "${{ github.ref }}"
          OCTOCOV_GITHUB_SHA: none
          OCTOCOV_CUSTOM_METRICS_BENCHMARK: custom_metrics_runn.json
